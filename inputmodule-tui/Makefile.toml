extend = "../Makefile.toml"

# Since it's a TUI tool, build it for the platform we're running on
[env]
TARGET_TRIPLE = "${CARGO_MAKE_RUST_TARGET_TRIPLE}"

[tasks.clippy]
args = ["clippy", "--target", "${CARGO_MAKE_RUST_TARGET_TRIPLE}", "--", "-Dwarnings"]

[tasks.run]
command = "cargo"
args = [
    "run",
    "--target",
    "${CARGO_MAKE_RUST_TARGET_TRIPLE}",
    "${@}",
]

[tasks.test]
disabled = false
command = "cargo"
args = ["test", "--target", "${CARGO_MAKE_RUST_TARGET_TRIPLE}", "-p", "inputmodule-tui"]
